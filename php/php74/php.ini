; =============================================================
; PHP 7.4.33  –  Win32 vc15 x64 NTS
; <stack-root>\php\php74\php.ini  (paths are relative; resolved from the PHP folder)
; =============================================================

[PHP]
engine                  = On
short_open_tag          = Off
output_buffering        = 4096
serialize_precision     = -1
disable_functions       =

; --- Resource limits ---
memory_limit            = 512M
max_execution_time      = 300
max_input_time          = 300
max_input_vars          = 5000

; --- Error handling (development) ---
error_reporting         = E_ALL
display_errors          = On
display_startup_errors  = On
log_errors              = On
error_log               = "php_errors.log"
html_errors             = On

; --- File uploads ---
file_uploads            = On
upload_max_filesize     = 64M
post_max_size           = 64M
max_file_uploads        = 20

; --- Misc ---
default_charset         = "UTF-8"
default_socket_timeout  = 60
expose_php              = Off

; --- FastCGI (required when fronted by Nginx) ---
; Prevents path-disclosure exploits via PATH_INFO
cgi.fix_pathinfo        = 0
; Must be 0 for Nginx; Apache mod_cgi users set to 1
cgi.force_redirect      = 0

; --- Extension directory ---
extension_dir           = "ext"

; =============================================================
; Extensions
; vc15 build ships php_gd2.dll – use extension=gd2 here.
; If you see "Cannot load module 'gd'" try extension=gd instead.
; =============================================================
extension = mbstring
extension = openssl
extension = sockets
extension = pdo_mysql
extension = mysqli
extension = curl
extension = gd2
extension = fileinfo
extension = intl
; zip extension disabled – php_zip.dll requires zlib1.dll (and possibly bz2.dll,
; zstd.dll) which are not bundled with this PHP 7.4.33 vc15 x64 build.
; To enable: download zlib, bz2, zstd deps from
;   https://windows.php.net/downloads/php-sdk/deps/vc15/x64/
; place the .dll files in this folder (root, not ext\), then uncomment:
; extension = zip
extension = exif

; --- OPcache ---
; Uncomment to enable. revalidate_freq=0 re-checks on every request (dev-safe).
; zend_extension          = opcache
; opcache.enable          = 1
; opcache.memory_consumption = 128
; opcache.interned_strings_buffer = 8
; opcache.max_accelerated_files = 10000
; opcache.validate_timestamps = 1
; opcache.revalidate_freq = 0

; --- CA bundle ---
; Download cacert.pem from https://curl.se/ca/cacert.pem, place in this dir.
; curl.cainfo    = "cacert.pem"
; openssl.cafile = "cacert.pem"

[Date]
date.timezone = Asia/Jakarta

[Session]
session.save_handler     = files
session.use_strict_mode  = 1
session.cookie_httponly  = 1
session.cookie_secure    = 1
session.use_only_cookies = 1

[mbstring]
mbstring.language = UTF-8

