; =============================================================
; PHP 8.2.31  –  Win32 vs16 x64 NTS
; <stack-root>\php\php82\php.ini  (paths are relative; resolved from the PHP folder)
; =============================================================

[PHP]
engine                  = On
short_open_tag          = Off
output_buffering        = 4096
serialize_precision     = -1
disable_functions       =

; --- Resource limits ---
memory_limit            = 512M
max_execution_time      = 300
max_input_time          = 300
max_input_vars          = 5000

; --- Error handling (development) ---
error_reporting         = E_ALL
display_errors          = On
display_startup_errors  = On
log_errors              = On
error_log               = "php_errors.log"
html_errors             = On

; --- File uploads ---
file_uploads            = On
upload_max_filesize     = 64M
post_max_size           = 64M
max_file_uploads        = 20

; --- Misc ---
default_charset         = "UTF-8"
default_socket_timeout  = 60
expose_php              = Off

; --- FastCGI (required when fronted by Nginx) ---
cgi.fix_pathinfo        = 0
cgi.force_redirect      = 0

; --- Extension directory ---
extension_dir           = "ext"

; =============================================================
; Extensions
; vs16 build ships php_gd.dll (renamed from gd2 in PHP 8.0).
; fileinfo is bundled in PHP 8.x but the line below is harmless.
; =============================================================
extension = mbstring
extension = openssl
extension = sockets
extension = pdo_mysql
extension = mysqli
extension = curl
extension = gd
extension = fileinfo
extension = intl
extension = zip
extension = exif

; --- OPcache ---
; zend_extension          = opcache
; opcache.enable          = 1
; opcache.memory_consumption = 128
; opcache.interned_strings_buffer = 8
; opcache.max_accelerated_files = 10000
; opcache.validate_timestamps = 1
; opcache.revalidate_freq = 0

; --- CA bundle ---
; curl.cainfo    = "cacert.pem"
; openssl.cafile = "cacert.pem"

[Date]
date.timezone = Asia/Jakarta

[Session]
session.save_handler     = files
session.use_strict_mode  = 1
session.cookie_httponly  = 1
session.cookie_secure    = 1
session.use_only_cookies = 1

[mbstring]
mbstring.language = UTF-8

