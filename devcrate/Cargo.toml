[package]
name = "devcrate"
version = "0.1.0"
edition = "2024"
description = "A portable, multi-PHP development stack for Windows"
license = "MIT"
repository = "https://github.com/fadjardev/devcrate-stack"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
# The terminal UI. Only the crossterm backend is wanted -- the default feature
# set drags in a colour-space crate and a calendar widget for nothing.
# crossterm comes through ratatui rather than as a second dependency, so the
# two can never disagree about a version.
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
# Only process inspection is used; the disk/network/component probes are dead
# weight here and drag in a pile of platform crates.
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
toml = "1.1.3"
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[profile.release]
strip = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    # GetExtendedTcpTable: which PID holds a listening port.
    "Win32_NetworkManagement_IpHelper",
    # GetConsoleMode / SetConsoleMode: enabling ANSI on a Windows console.
    "Win32_System_Console",
] }
