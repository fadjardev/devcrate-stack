# =============================================================
# supplier.qhomemart.cloud.test
# Project root : E:\dev\projects\supplier.qhomemart.cloud
# Web root     : project root  (CodeIgniter 2)
# PHP          : 7.4  â†’  127.0.0.1:9074
# Cert         : _wildcard.qhomemart.cloud.test  (covers *.qhomemart.cloud.test)
# =============================================================

server {
    listen       80;
    server_name  supplier.qhomemart.cloud.test;
    return 301   https://$host$request_uri;
}

server {
    listen       443 ssl;
    server_name  supplier.qhomemart.cloud.test;

    root   E:/dev/projects/supplier.qhomemart.cloud;
    index  index.php index.html;

    ssl_certificate      E:/dev/nginx-1.31.1/conf/certs/_wildcard.qhomemart.cloud.test.pem;
    ssl_certificate_key  E:/dev/nginx-1.31.1/conf/certs/_wildcard.qhomemart.cloud.test-key.pem;

    access_log  E:/dev/nginx-1.31.1/logs/supplier.qhomemart.cloud.test.access.log  main;
    error_log   E:/dev/nginx-1.31.1/logs/supplier.qhomemart.cloud.test.error.log   warn;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Block direct access to CI3 internals
    location ~ ^/(application|system|vendor)/ {
        deny all;
    }

    location ~ \.php$ {
        try_files       $uri =404;
        fastcgi_pass    127.0.0.1:9074;
        fastcgi_index   index.php;
        include         fastcgi_params;
        fastcgi_param   SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        fastcgi_param   HTTPS            on;
    }

    location ~ /\. {
        deny all;
    }
}
