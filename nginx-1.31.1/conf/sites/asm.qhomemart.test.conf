# =============================================================
# asm.qhomemart.test
# Project root : <stack-root>\projects\asm.qhomemart.cloud
# Web root     : project root  (CodeIgniter 3)
# PHP          : 8.2  ->  127.0.0.1:9082  (requires >= 8.1)
# Cert         : _wildcard.qhomemart.test  (covers *.qhomemart.test)
# =============================================================

server {
    listen       80;
    server_name  asm.qhomemart.test;
    return 301   https://$host$request_uri;
}

server {
    listen       443 ssl;
    server_name  asm.qhomemart.test;

    root   projects/asm.qhomemart.cloud;
    index  index.php index.html;

    ssl_certificate      certs/_wildcard.qhomemart.test.pem;
    ssl_certificate_key  certs/_wildcard.qhomemart.test-key.pem;

    access_log  logs/asm.qhomemart.test.access.log  main;
    error_log   logs/asm.qhomemart.test.error.log   warn;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Block direct access to CI3 internals
    location ~ ^/(application|system|vendor)/ {
        deny all;
    }

    location ~ \.php$ {
        try_files       $uri =404;
        fastcgi_pass    127.0.0.1:9082;
        fastcgi_index   index.php;
        include         fastcgi_params;
        fastcgi_param   SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        fastcgi_param   HTTPS            on;
        # Inject BASE_URL so CI3 config.php picks it up via getenv('BASE_URL')
        fastcgi_param   BASE_URL         https://asm.qhomemart.test/;
    }

    location ~ /\. {
        deny all;
    }
}
