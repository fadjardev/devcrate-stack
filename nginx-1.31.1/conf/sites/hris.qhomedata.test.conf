# =============================================================
# hris.qhomedata.test
# Project root : <stack-root>\projects\hris.qhomedata.id
# Web root     : project root  (CodeIgniter 3)
# PHP          : 8.2  ->  127.0.0.1:9082  (requires >= 8.2)
# Cert         : _wildcard.qhomedata.test  (covers *.qhomedata.test)
# =============================================================

server {
    listen       80;
    server_name  hris.qhomedata.test;
    return 301   https://$host$request_uri;
}

server {
    listen       443 ssl;
    server_name  hris.qhomedata.test;

    root   projects/hris.qhomedata.id;
    index  index.php index.html;

    ssl_certificate      certs/_wildcard.qhomedata.test.pem;
    ssl_certificate_key  certs/_wildcard.qhomedata.test-key.pem;

    access_log  logs/hris.qhomedata.test.access.log  main;
    error_log   logs/hris.qhomedata.test.error.log   warn;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Block direct access to CI3 internals
    # docs/ holds internal architecture notes and the raw OpenAPI specs; they are
    # served to Swagger UI through the Apidocs controller, which is session-gated.
    location ~ ^/(application|system|vendor|docs)/ {
        deny all;
    }

    # composer manifests expose the full dependency inventory and versions
    location ~ ^/composer\.(json|lock)$ {
        deny all;
    }

    location ~ \.php$ {
        try_files       $uri =404;
        fastcgi_pass    127.0.0.1:9082;
        fastcgi_index   index.php;
        include         fastcgi_params;
        fastcgi_param   SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        fastcgi_param   HTTPS            on;
        # Opt this host in to the Swagger UI at /apidocs (see Apidocs.php).
        # Deliberately NOT CI_ENV=development: that flips CI's global
        # display_errors on, and this CI3 build emits PHP 8.2 deprecation
        # notices from core/URI.php that break header redirects and corrupt
        # JSON responses. This flag does one thing only.
        # Do NOT set this on staging or production.
        fastcgi_param   HRIS_API_DOCS    enabled;
    }

    location ~ /\. {
        deny all;
    }
}
