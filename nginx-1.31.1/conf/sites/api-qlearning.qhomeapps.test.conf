# =============================================================
# api-qlearning.qhomeapps.test
# Project root : E:\dev\projects\api-qlearning.qhomeapps.id
# Web root     : .../public  (CodeIgniter 4)
# PHP          : 8.2  â†’  127.0.0.1:9082
# Cert         : _wildcard.qhomeapps.test  (covers *.qhomeapps.test)
# =============================================================

server {
    listen       80;
    server_name  api-qlearning.qhomeapps.test;
    return 301   https://$host$request_uri;
}

server {
    listen       443 ssl;
    server_name  api-qlearning.qhomeapps.test;

    root   E:/dev/projects/api-qlearning.qhomeapps.id/public;
    index  index.php index.html;

    ssl_certificate      E:/dev/nginx-1.31.1/conf/certs/_wildcard.qhomeapps.test.pem;
    ssl_certificate_key  E:/dev/nginx-1.31.1/conf/certs/_wildcard.qhomeapps.test-key.pem;

    access_log  E:/dev/nginx-1.31.1/logs/api-qlearning.qhomeapps.test.access.log  main;
    error_log   E:/dev/nginx-1.31.1/logs/api-qlearning.qhomeapps.test.error.log   warn;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files       $uri =404;
        fastcgi_pass    127.0.0.1:9082;
        fastcgi_index   index.php;
        include         fastcgi_params;
        fastcgi_param   SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        fastcgi_param   HTTPS            on;
    }

    location ~ /\. {
        deny all;
    }
}
