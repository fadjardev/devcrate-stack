# =============================================================
# <stack-root>\nginx-1.31.1\conf\nginx.conf
#
# Start with:  nginx.exe -p <stack-root>\nginx-1.31.1
# (start.bat does this for you, resolving the stack root from
# its own location.) The -p flag sets the prefix so logs/, conf/,
# temp/ -- and every relative path in the vhost confs -- resolve
# against that folder. Vhost "root projects/<domain>" resolves
# through the <prefix>\projects junction -> <stack-root>\projects
# (created by start.bat; PHP-CGI rejects ".." in SCRIPT_FILENAME,
# so the junction keeps the path dot-free).
# =============================================================

worker_processes  auto;

pid  logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    charset       utf-8;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';

    access_log  logs/access.log  main;
    error_log   logs/error.log   warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    keepalive_timeout  65;

    # Required when server_name values exceed ~32 chars (e.g. api-name.group.test)
    server_names_hash_bucket_size  128;

    # Match PHP upload / post limits
    client_max_body_size  64M;

    # --- Gzip ---
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/xml text/javascript
                      application/json application/javascript
                      application/xml application/xml+rss
                      image/svg+xml;

    # --- TLS defaults (inherited by every ssl server block) ---
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # --- FastCGI global timeouts / buffers ---
    fastcgi_connect_timeout    60s;
    fastcgi_send_timeout       180s;
    fastcgi_read_timeout       180s;
    fastcgi_buffer_size        128k;
    fastcgi_buffers            4 256k;
    fastcgi_busy_buffers_size  256k;
    fastcgi_intercept_errors   on;

    # --- Virtual hosts ---
    # Each file in conf/sites/ is one vhost.
    # Relative include paths resolve against the directory of this file,
    # i.e. <prefix>\conf\  ->  sites/ = conf\sites\
    include sites/*.conf;
}
